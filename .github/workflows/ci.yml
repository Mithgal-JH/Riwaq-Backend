name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore Riwaq.Backend.sln

      - name: Build solution
        run: dotnet build Riwaq.Backend.sln --no-restore

      - name: Run tests
        run: dotnet test Riwaq.Backend.sln --no-build
